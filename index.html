<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrackCast — Perjalanan Aman, Liburan Nyaman</title>
  <meta name="description" content="Aplikasi keselamatan perjalanan wisata Indonesia: cuaca hyperlocal BMKG, peta digital status destinasi, dan tombol darurat SOS.">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/landing.css">
</head>
<body>
  <div class="landing-shell">
    
    <!-- Central Brand & Splash -->
    <main class="landing-content">
      <!-- Logo Box -->
      <div class="logo-box" aria-hidden="true">
        <img src="assets/images/logo.png" alt="Logo TrackCast" class="logo-img">
      </div>

      <!-- Typography -->
      <h1 class="landing-brand">
        <span class="brand-track">TRACK</span><span class="brand-cast">CAST</span>
      </h1>
      
      <p class="landing-sub">Cuaca Akurat · Peta Digital · Layanan Darurat</p>
      <p class="landing-quote">Perjalanan Aman, Liburan Nyaman.</p>

      <!-- Primary Action -->
      <div class="landing-cta-wrap">
        <a href="auth.html" id="btn-start" class="btn-landing-primary">
          Mulai Sekarang
        </a>
      </div>

      <p class="landing-features-text">Aman · Terverifikasi · Hyperlocal</p>
    </main>

    <!-- Bottom Feature Badges -->
    <footer class="landing-footer">
      <div class="feat-item">
        <div class="feat-icon-box">⛅</div>
        <span class="feat-label">Cuaca<br>Hyperlocal</span>
      </div>
      <div class="feat-item">
        <div class="feat-icon-box">🗺️</div>
        <span class="feat-label">Peta<br>Digital</span>
      </div>
      <div class="feat-item">
        <div class="feat-icon-box sos-box">SOS</div>
        <span class="feat-label">Tanggap<br>Darurat</span>
      </div>
    </footer>

  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/landing.js"></script>
</body>
</html>
