<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrackCast — Buat Akun Baru</title>
  <meta name="description"
    content="Daftar ke aplikasi TrackCast untuk memantau cuaca hyperlocal dan status keselamatan perjalanan wisata Indonesia.">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>
  <div class="auth-shell">

    <!-- Header Brand & Logo -->
    <header class="auth-header">
      <div class="auth-logo-box">
        <img src="assets/images/logo.png" alt="TrackCast Logo" class="auth-logo-img">
      </div>
      <h1 class="auth-brand">
        <span class="brand-track">TRACK</span><span class="brand-cast">CAST</span>
      </h1>
      <p class="auth-subtitle" id="auth-subtitle">Daftar Akun Baru</p>
    </header>

    <!-- Main Auth Card -->
    <main class="auth-card">

      <!-- Method Toggle: Email vs Username -->
      <div class="method-toggle" role="tablist">
        <button type="button" class="method-btn active" id="btn-method-email" role="tab" aria-selected="true">
          <svg class="method-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <span>Email</span>
        </button>
        <button type="button" class="method-btn" id="btn-method-username" role="tab" aria-selected="false">
          <svg class="method-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Username</span>
        </button>
      </div>

      <!-- Auth Form -->
      <form id="auth-form" novalidate>

        <!-- Registration Only: Nama Lengkap -->
        <div class="form-group register-only" id="group-name">
          <label class="form-label" for="input-name">Nama Lengkap</label>
          <div class="input-wrap">
            <input type="text" id="input-name" class="form-input" placeholder="Nama lengkap Anda" autocomplete="name" required>
          </div>
        </div>

        <!-- Field: Alamat Email -->
        <div class="form-group" id="group-email">
          <label class="form-label" for="input-email">Alamat Email</label>
          <div class="input-wrap">
            <input type="email" id="input-email" class="form-input" placeholder="nama@email.com" autocomplete="email" required>
          </div>
        </div>

        <!-- Field: Username -->
        <div class="form-group" id="group-username" style="display: none;">
          <label class="form-label" for="input-username">Username</label>
          <div class="input-wrap">
            <input type="text" id="input-username" class="form-input" placeholder="Masukkan username" autocomplete="username">
          </div>
        </div>

        <!-- Field: Kata Sandi -->
        <div class="form-group" id="group-password">
          <label class="form-label" for="input-password">Kata Sandi</label>
          <div class="input-wrap">
            <input type="password" id="input-password" class="form-input" placeholder="Min. 8 karakter" autocomplete="new-password" required>
            <button type="button" class="toggle-pwd-btn" id="toggle-pwd" aria-label="Tampilkan kata sandi" title="Tampilkan kata sandi">
              <img src="assets/images/view.png" alt="Tampilkan kata sandi" class="pwd-icon icon-view">
              <img src="assets/images/hide.png" alt="Sembunyikan kata sandi" class="pwd-icon icon-hide">
            </button>
          </div>
        </div>

        <!-- Field: Konfirmasi Kata Sandi (Register Only) -->
        <div class="form-group register-only" id="group-password-confirm">
          <label class="form-label" for="input-password-confirm">Konfirmasi Kata Sandi</label>
          <div class="input-wrap">
            <input type="password" id="input-password-confirm" class="form-input" placeholder="Ulangi kata sandi" autocomplete="new-password">
            <button type="button" class="toggle-pwd-btn" id="toggle-pwd-confirm" aria-label="Tampilkan kata sandi" title="Tampilkan kata sandi">
              <img src="assets/images/view.png" alt="Tampilkan kata sandi" class="pwd-icon icon-view">
              <img src="assets/images/hide.png" alt="Sembunyikan kata sandi" class="pwd-icon icon-hide">
            </button>
          </div>
        </div>

        <!-- Checkbox: Syarat & Ketentuan (Register Only) -->
        <div class="form-group register-only terms-group" id="group-terms">
          <label class="checkbox-container">
            <input type="checkbox" id="check-terms" class="checkbox-native">
            <span class="custom-checkbox" aria-hidden="true">
              <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
            <span class="terms-text">
              Saya menyetujui <a href="#" class="terms-link">Syarat & Ketentuan</a> serta <a href="#" class="terms-link">Kebijakan Privasi</a> TrackCast
            </span>
          </label>
        </div>

        <!-- Forgot Password Link (Login Only) -->
        <div class="forgot-wrap login-only" id="wrap-forgot" style="display: none;">
          <a href="#" class="forgot-link" id="link-forgot">Lupa kata sandi?</a>
        </div>

        <!-- Primary Action Button -->
        <button type="submit" class="btn-submit-primary" id="btn-submit">
          Buat Akun
        </button>

      </form>

      <!-- Divider (Login Only) -->
      <div class="auth-divider login-only" style="display: none;">
        <span>atau</span>
      </div>

      <!-- Google SSO Button (Login Only) -->
      <button type="button" class="btn-google login-only" id="btn-google" style="display: none;">
        <span>🌐</span> Masuk dengan Google
      </button>

    </main>

    <!-- Switcher Footer -->
    <footer class="auth-footer">
      <span id="auth-footer-prompt">Sudah punya akun?</span>
      <a href="#" class="auth-switch-link" id="switch-auth-mode">Masuk</a>
    </footer>

  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/auth.js"></script>
</body>

</html>
